app:
  base-url: ${APP_BASE_URL}

spring:
  application:
    name: SplitBills

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  liquibase:
    change-log: classpath:db/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  expirationMs: ${JWT_EXPIRATION}

logging:
  level:
    liquibase: DEBUG