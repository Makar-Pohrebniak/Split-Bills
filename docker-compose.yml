services:
  splitbills-db:
    image: mysql:8.0
    container_name: splitbills-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: split_bills_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  splitbills-redis:
    image: redis:7.2-alpine
    container_name: splitbills-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data: